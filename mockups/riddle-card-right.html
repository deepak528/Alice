<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1024"><title>Riddle card mock-up</title><style>
  :root {
    --bg: #f5ecd9;
    --bg-glow: #fff8e8;
    --ink: #2e2618;
    --muted: #6e5f47;
    --card: #fffaf0;
    --line: #dccba8;
    --slot: #efe2c6;
    --accent: #3f7a4a;
    --accent-ink: #ffffff;
    --shadow: 0 10px 30px rgba(60, 40, 10, .18);
    --font-story: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-ui: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  body[data-theme="garden"] {   /* Map 2.0: the Queen's rose garden */
    --bg: #f8e6e2;
    --bg-glow: #fff4ef;
    --line: #e6c4bc;
    --slot: #f6dcd6;
    --accent: #b8283c;
  }
  body[data-theme="magic"] {
    --bg: #1a1230;
    --bg-glow: #3a2366;
    --ink: #f4edff;
    --muted: #bcaee0;
    --card: #261a45;
    --line: #4a3776;
    --slot: #33255c;
    --accent: #d07be0;
    --accent-ink: #1a1230;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 0%, var(--bg-glow), var(--bg) 70%) var(--bg);
    color: var(--ink);
    font: 16px/1.4 var(--font-ui);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #app {
    height: 100vh; height: 100dvh;
    max-width: 1800px; margin: 0 auto;
    padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
      calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 8px;
  }

  /* ---------- HUD ---------- */
  #hud { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
  #hearts { font-size: 1.25rem; letter-spacing: 2px; white-space: nowrap; min-width: 5.5em; }
  #hearts .easy-badge { font-size: .85rem; letter-spacing: 0; color: var(--muted); }
  #inventory { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .slot {
    width: 38px; height: 38px; border-radius: 10px; position: relative;
    display: grid; place-items: center; font-size: 1.35rem; color: var(--muted);
    background: var(--slot); border: 2px dashed var(--line);
  }
  .slot img { width: 1.3em; height: 1.3em; }
  .slot.held { border-style: solid; border-color: var(--accent); }
  .slot.used { opacity: .5; border-style: solid; }
  .slot.used::after {
    content: '✓'; position: absolute; right: -6px; bottom: -6px;
    width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
    font-size: .75rem; font-weight: 700; background: var(--accent); color: var(--accent-ink);
  }
  .hud-buttons { display: flex; gap: 6px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
    border: 1px solid var(--line); background: var(--card); font-size: 1.1rem;
  }
  .icon-btn[aria-pressed="false"] { opacity: .45; }
  #btn-view { font-weight: 700; font-size: .9rem; }
  /* Fixed two-line height so a long message never changes the bar's height and nudges the maze. */
  #message {
    flex: 1 1 0; min-width: 0; height: 2.6em; margin: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-family: var(--font-story); font-size: 1.05rem; line-height: 1.3;
  }
  @media (max-width: 640px) {
    #inventory { order: 3; width: 100%; }
    #message { order: 4; flex-basis: 100%; }
  }

  /* ---------- Board ---------- */
  #stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #board { position: relative; z-index: 1; display: block; border-radius: 12px; box-shadow: var(--shadow); }
  /* The 3D scene renders here, exactly under the board, which then only carries the mini-map and effects. */
  #world { position: absolute; inset: 0; margin: auto; display: block; border-radius: 12px; }
  /* "Item Collected" banner that pops over the maze for a moment. */
  #toast {
    position: absolute; top: 12%; left: 50%; z-index: 2; opacity: 0; pointer-events: none;
    padding: 10px 24px; border-radius: 999px; white-space: nowrap;
    background: var(--card); color: var(--ink); border: 2px solid var(--accent); box-shadow: var(--shadow);
    font: 700 1.3rem/1.2 var(--font-story); transform: translateX(-50%);
  }
  #toast.show { animation: toast 2.2s ease forwards; }
  /* Follow the White Rabbit's storybook captions, across the top of the maze like the words in a picture book. */
  #caption {
    position: absolute; top: 10px; left: 50%; z-index: 2; max-width: min(90%, 640px); margin: 0; pointer-events: none;
    padding: 8px 20px; border-radius: 14px; text-align: center; transform: translateX(-50%);
    background: var(--card); color: var(--ink); box-shadow: var(--shadow);
    font: italic 600 1.15rem/1.35 var(--font-story); animation: caption .6s ease;
  }
  #caption[hidden] { display: none; }
  @keyframes caption { from { opacity: 0; transform: translate(-50%, -8px); } }
  @keyframes toast {
    0% { opacity: 0; transform: translate(-50%, 12px) scale(.9); }
    12%, 75% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -10px) scale(1); }
  }

  /* ---------- Touch arrows ---------- */
  /* Always shown (an iPad first, a computer too), floating over the bottom-right corner of the maze, within reach of the right thumb. */
  #dpad {
    display: grid; grid-template-columns: repeat(3, 64px); gap: 8px;
    position: fixed; z-index: 5; right: calc(20px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom));
  }
  #dpad button {
    height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); opacity: .82;
    box-shadow: var(--shadow); font-size: 1.4rem; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #dpad button:active { background: var(--slot); }
  #dpad [data-dir="up"] { grid-area: 1 / 2; }
  #dpad [data-dir="left"] { grid-area: 2 / 1; }
  #dpad [data-dir="down"] { grid-area: 2 / 2; }
  #dpad [data-dir="right"] { grid-area: 2 / 3; }
  .touch .keys { display: none; }
  @media (max-width: 640px) {
    #dpad { grid-template-columns: repeat(3, 56px); gap: 6px; }
    #dpad button { height: 50px; }
  }

  /* ---------- Menus ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center;
    background: rgba(20, 14, 30, .45); backdrop-filter: blur(3px);
  }
  .card {
    width: 100%; max-width: 440px; max-height: calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 24px; box-shadow: var(--shadow);
  }
  .title { margin: 0; text-align: center; font-family: var(--font-story); font-weight: normal; line-height: 1.05; }
  .title small { display: block; font-size: 1.15rem; font-style: italic; color: var(--muted); }
  .title span { font-size: 2.6rem; font-weight: bold; }
  .cast { margin: 10px 0 4px; text-align: center; font-size: 1.5rem; letter-spacing: 6px; }
  .tagline { margin: 0 0 16px; text-align: center; color: var(--muted); }
  .setting { padding: 12px 0; border-top: 1px solid var(--line); }
  .setting-label { display: block; margin-bottom: 6px; font-weight: 600; }
  .setting select {
    width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--slot); color: var(--ink); font: inherit; font-size: .95rem;
  }
  .slider-row { display: flex; align-items: center; gap: 10px; font-size: .95rem; white-space: nowrap; }
  input[type="range"] { width: 100%; min-width: 0; accent-color: var(--accent); }
  .ticks { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); }
  .note { margin: 6px 0 0; font-size: .85rem; color: var(--muted); }
  .switch-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--line); font-weight: 600; cursor: pointer;
  }
  /* The finer settings, folded away until the arrow is clicked. */
  .more { border-top: 1px solid var(--line); }
  .more summary {
    display: flex; align-items: center; gap: 10px; padding: 12px 0; font-weight: 600; cursor: pointer; list-style: none;
  }
  .more summary::-webkit-details-marker { display: none; }
  .more summary::before { content: '▸'; color: var(--accent); transition: transform .2s; }
  .more[open] summary::before { transform: rotate(90deg); }
  .switch-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch { position: relative; flex: none; width: 48px; height: 28px; border-radius: 14px; background: var(--line); transition: background .2s; }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s;
  }
  .switch-row input:checked + .switch { background: var(--accent); }
  .switch-row input:checked + .switch::after { transform: translateX(20px); }
  .switch-row input:focus-visible + .switch { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary, .secondary { width: 100%; padding: 13px; border-radius: 14px; font-size: 1.05rem; font-weight: 700; }
  .primary { margin-top: 14px; border: 0; background: var(--accent); color: var(--accent-ink); }
  .secondary { margin-top: 8px; border: 1px solid var(--line); background: transparent; }
  .keys { margin: 12px 0 0; text-align: center; font-size: .8rem; color: var(--muted); }
  .big-icon { font-size: 4rem; text-align: center; }
  #end h2, #riddle h2 { margin: 4px 0 8px; text-align: center; font-family: var(--font-story); font-size: 2rem; }
  #end p, #riddle p { margin: 0; text-align: center; color: var(--muted); }
  /* Tea Party: the golden key's slot in the HUD. */
  #letters { display: flex; gap: 4px; }
  /* Tea Party riddles: three big picture answers. */
  #riddle-answers { display: grid; gap: 10px; margin-top: 14px; }
  #riddle-answers button {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; cursor: pointer;
    font: 600 1.15rem var(--font-story); color: var(--ink); background: var(--slot); border: 2px solid var(--line); text-align: left;
  }
  #riddle-answers button span { font-size: 2rem; }
  #riddle-answers button.right { border-color: #3aa65a; background: #dff5e4; }
  #riddle-answers button.wrong { border-color: #d8455a; animation: shake .4s; }
  #riddle-answers button:disabled { cursor: default; }
  #riddle-q { font-size: 1.15rem; color: var(--ink) !important; }
  /* Tea Party puzzles (Pour the tea, Change places): big pictures to tap, for small fingers on an iPad. */
  #teacups .card { max-width: 620px; }
  #teacups h2 { margin: 4px 0 8px; text-align: center; font-family: var(--font-story); font-size: 2rem; }
  #teacups p { margin: 0; text-align: center; color: var(--ink); font: 600 1.15rem var(--font-story); min-height: 2.6em; }
  .cup-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .cup-row button, #cups-round .cup {
    position: relative; display: grid; place-items: center; cursor: pointer; touch-action: manipulation; padding: 6px;
    background: var(--slot); border: 3px solid var(--line); color: var(--ink); font: 600 .95rem var(--font-story);
    transition: transform .15s, border-color .15s;
  }
  .cup-row button { width: 112px; min-height: 112px; border-radius: 18px; }
  .cup-row button img { width: 72px; height: 72px; object-fit: contain; }
  .badge { position: absolute; top: 4px; right: 6px; font-size: 1.7rem; line-height: 1; }
  .cup-row button.picked { border-color: var(--accent); transform: translateY(-6px); box-shadow: 0 6px 14px rgba(0, 0, 0, .2); }
  .cup-row button.wrong, #cups-round .cup.wrong { border-color: #d8455a; animation: shake .4s; }
  .cup-row button.done, #cups-round .cup.right { border-color: #3aa65a; background: #dff5e4; }
  .cup-row button.gone { visibility: hidden; }
  .cup-row button:disabled, #cups-round .cup:disabled { cursor: default; }
  #cups-round { position: relative; width: min(78vw, 52dvh, 420px); aspect-ratio: 1; margin: 6px auto 0; }
  #cups-round .tabletop {
    position: absolute; inset: 26%; border-radius: 50%; background: radial-gradient(#fff 55%, #e9eef7);
    border: 5px solid #5b84c4; box-shadow: inset 0 0 0 6px #fff;
  }
  #cups-round .seat { position: absolute; width: 18%; aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; }
  #cups-round .seat img { width: 100%; height: 100%; object-fit: contain; }
  #cups-round .cup {
    position: absolute; width: 17%; height: 17%; padding: 0; border-radius: 50%; transform: translate(-50%, -50%);   /* the round is square */
    transition: left 1.1s ease-in-out, top 1.1s ease-in-out, border-color .15s;
  }
  #cups-round .cup img { width: 74%; height: 74%; object-fit: contain; }
  #cups-round .cup.plain .badge { visibility: hidden; }
  /* Paint the roses red: a big rose bush, each white rose a button. */
  #cups-roses { position: relative; width: min(70vw, 46dvh, 340px); aspect-ratio: 1; margin: 8px auto 0; }
  #cups-roses .bush {
    position: absolute; inset: 4%; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #5aa04a, #2f6b2a 70%); box-shadow: inset 0 -12px 24px rgba(0, 0, 0, .28);
  }
  #cups-roses .rose {
    position: absolute; width: 24%; height: 24%; transform: translate(-50%, -50%); border-radius: 50%; padding: 0;
    border: 3px solid #e8e2d6; background: radial-gradient(circle, #fff 25%, #efe9df 55%, #fbf8f2 75%);
    cursor: pointer; touch-action: manipulation; box-shadow: 0 3px 8px rgba(0, 0, 0, .25);
  }
  #cups-roses .rose.painted {
    border-color: #a3121f; background: radial-gradient(circle, #7d0b17 15%, #d4202f 45%, #ee4b59 75%); animation: splash .35s;
  }
  #cups-roses .rose:disabled { cursor: default; }
  @keyframes splash { from { transform: translate(-50%, -50%) scale(1.3); } to { transform: translate(-50%, -50%) scale(1); } }
  #riddle-answers button img { width: 56px; height: 56px; object-fit: contain; }
  #letters .roses { width: auto; padding: 0 8px; font-size: .95rem; white-space: nowrap; }
  /* The fall down the rabbit hole: over the 3D scene just a hint to skip; in 2D (or without 3D) a dreamy card. */
  #fall {
    position: fixed; inset: 0; z-index: 9; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px;
    padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); color: #fff6e0; text-align: center;
    text-shadow: 0 2px 8px rgba(0, 0, 0, .6);
  }
  #fall[hidden] { display: none; }
  #fall h2 { margin: 0; font: 700 2.2rem var(--font-story); }
  #fall p { margin: 0; font-size: .95rem; opacity: .85; }
  #fall:not(.card-view) h2 { font-size: 1.5rem; }
  #fall.card-view { justify-content: center; background: radial-gradient(circle at 50% 40%, #6a4a7a, #1e1228 70%); }
  #fall.card-view h2 { animation: drift 3s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateY(-14px) rotate(-3deg); } to { transform: translateY(14px) rotate(3deg); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }


#riddle.overlay{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;justify-content:flex-end;align-items:center;padding-right:24px;pointer-events:none}
#riddle .card{pointer-events:auto;max-width:352px;padding:18px 19px;font-size:.8rem;box-shadow:0 10px 30px rgba(40,20,30,.35)}
#riddle .big-icon{font-size:3.2rem}
#riddle .big-icon canvas,#riddle .big-icon img{width:64px!important;height:auto!important}
#riddle h2{font-size:1.6rem;margin:2px 0 6px}
#riddle-q{font-size:.95rem}
#riddle-answers{gap:8px;margin-top:11px}
#riddle-answers button{padding:8px 11px;font-size:.95rem;gap:10px}
#riddle-answers button span{font-size:1.6rem}
#riddle-answers button img{width:45px;height:45px}
#riddle-text{font-size:.8rem}
#dpad{visibility:hidden}
html,body{margin:0}
.frame{position:relative;width:1024px;height:768px;margin:0 auto;overflow:hidden}
.frame #app{position:absolute;inset:0;height:768px}
.frame .overlay{position:absolute}
.shot{position:absolute;left:0;top:0;width:992px;height:692px;border-radius:inherit}
</style></head><body><div class="frame"><div id="app">
